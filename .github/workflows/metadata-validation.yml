name: Array transfer metadata validation

on:
  push:
    paths:
      - "CITATION.cff"
      - "codemeta.json"
      - "DESCRIPTION"
      - "README.md"
      - "REPRODUCIBILITY.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "requirements-providers.txt"
      - "R/**"
      - "paper/array-manuscript.md"
      - "paper/submission/**"
      - "python/validate_array_manuscript.py"
      - "python/validate_resubmission_metadata.py"
      - ".github/workflows/metadata-validation.yml"
  pull_request:
    paths:
      - "CITATION.cff"
      - "codemeta.json"
      - "DESCRIPTION"
      - "README.md"
      - "REPRODUCIBILITY.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "requirements-providers.txt"
      - "R/**"
      - "paper/array-manuscript.md"
      - "paper/submission/**"
      - "python/validate_array_manuscript.py"
      - "python/validate_resubmission_metadata.py"
      - ".github/workflows/metadata-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-array-transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CFF validator
        run: python -m pip install --disable-pip-version-check cffconvert==2.0.0
      - name: Validate Citation File Format schema
        run: cffconvert --validate
      - name: Validate v1.4 Array transfer metadata consistency
        run: python python/validate_resubmission_metadata.py
      - name: Validate Array manuscript and evidence
        run: python python/validate_array_manuscript.py
