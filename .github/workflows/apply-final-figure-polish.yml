name: Apply final figure polish

on:
  push:
    branches:
      - codex/earth-science-informatics-refinement-v1.3.0
    paths:
      - .github/workflows/apply-final-figure-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-science-informatics-refinement-v1.3.0
          fetch-depth: 0

      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object R/make_manuscript_figures.R)" = "f478b7fc572c2999c9330b153342b673dbdc4475"
          test "$(git hash-object paper/figures/ALT_TEXT.md)" = "93c85ae1b83141668b42187ffb99a70735d3e5cf"
          test "$(git hash-object paper/figures/README.md)" = "1452ba0c3f8fc24b4267cc1576c207cfaa3f31b3"

      - name: Apply guarded source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {found}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          r_path = "R/make_manuscript_figures.R"
          replace_exact(
              r_path,
              "# Supplementary Figure S1: standardized district distributions permit\n# cross-layer comparison without implying that the four variables share\n# physical units. Distinct line types and symbols avoid reliance on colour.\n",
              "# Supplementary Figure S1: standardized district distributions permit\n# cross-layer comparison without implying that the four variables share\n# physical units. Colour-blind-friendly hues, line types, and symbols provide\n# redundant visual encoding.\n",
          )
          replace_exact(
              r_path,
              'colnames(values) <- c("Rainfall", "Temperature", "NDVI", "HAND share")\n\npc <-',
              'colnames(values) <- c("Rainfall", "Temperature", "NDVI", "HAND share")\nprofile_colours <- c("#0072B2", "#E69F00", "#009E73", "#CC79A7")\n\npc <-',
          )
          replace_exact(r_path, '    col = rep("black", 4)\n', '    col = profile_colours\n', expected=2)

          replace_exact(
              r_path,
              '  box(9.70, 5.03, 10.91, 5.62, "Return empty string", cex = 0.58)\n  arrow(10.42, 6.25, 10.30, 5.62, "No", 10.57, 5.94)\n',
              '  box(9.78, 5.00, 10.82, 5.54, "Return empty string", cex = 0.58)\n  arrow(10.42, 6.25, 10.30, 5.54, "No", 10.57, 5.94)\n',
          )
          replace_exact(
              r_path,
              '  box(9.71, 3.80, 10.91, 4.39, "Return \\"illustrative\\"", cex = 0.55)\n  arrow(10.33, 4.81, 10.30, 4.39, "Yes", 10.51, 4.59)\n',
              '  box(9.78, 3.80, 10.82, 4.36, "Return \\"illustrative\\"", cex = 0.55)\n  arrow(10.33, 4.81, 10.30, 4.36, "Yes", 10.51, 4.59)\n',
          )
          replace_exact(
              r_path,
              '    9.58, 1.73, 10.91, 2.64,\n    "Synthetic or placeholder\\noutput note",\n',
              '    9.58, 1.73, 10.82, 2.64,\n    "Synthetic or placeholder\\noutput note",\n',
          )
          replace_exact(
              r_path,
              '  arrow(10.38, 3.32, 10.24, 2.64, "No", 10.55, 2.97)\n',
              '  arrow(10.38, 3.32, 10.20, 2.64, "No", 10.52, 2.97)\n',
          )

          replace_exact(
              "paper/figures/ALT_TEXT.md",
              "The four variables use different point symbols and line types.",
              "The four variables use distinct colour-blind-friendly hues, point symbols, and line types.",
          )
          replace_exact(
              "paper/figures/ALT_TEXT.md",
              "- All four series are black and differentiated by both symbols and line types.",
              "- The four series use distinct colour-blind-friendly hues and are also differentiated by symbols and line types, so colour is not the sole encoding.",
          )
          replace_exact(
              "paper/figures/README.md",
              "- The map palette is perceptually ordered and designed to remain interpretable when converted to greyscale.\n",
              "- The map palette is perceptually ordered and designed to remain interpretable when converted to greyscale.\n- Supplementary Figure S1 uses a colour-blind-friendly four-series palette with redundant point symbols and line types, so interpretation does not depend on colour alone.\n",
          )
          PY

      - name: Verify modifications and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'profile_colours <- c("#0072B2", "#E69F00", "#009E73", "#CC79A7")' R/make_manuscript_figures.R
          test "$(grep -F -c 'col = profile_colours' R/make_manuscript_figures.R)" -eq 2
          grep -F 'box(9.78, 5.00, 10.82, 5.54, "Return empty string"' R/make_manuscript_figures.R
          grep -F 'colour-blind-friendly four-series palette' paper/figures/README.md
          git rm .github/workflows/apply-final-figure-polish.yml

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/make_manuscript_figures.R paper/figures/ALT_TEXT.md paper/figures/README.md
          git commit -m "Polish supplementary profile colours and provenance spacing"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0
