name: Execute guarded v1.2.0 release freeze

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/execute-v1.2.0-freeze.yml
  push:
    branches:
      - codex/earth-science-informatics-refinement-v1.3.0
    paths:
      - .github/workflows/execute-v1.2.0-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-science-informatics-refinement-v1.3.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify helper-only branch state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2cdee9d49b9ffa9c8d861f64a7a6ad0c81a9cd08"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/execute-v1.2.0-freeze.yml"

      - name: Execute reviewed transformation block
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/apply-v1.2.0-freeze.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply release-facing metadata and documentation edits\n        shell: python\n        run: |\n'
          end = '\n      - name: Remove temporary workflow before manifest generation\n'
          if source.count(marker) != 1 or source.count(end) != 1:
              raise SystemExit('Could not locate the reviewed transformation block exactly once')
          block = source.split(marker, 1)[1].split(end, 1)[0]
          lines = block.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Unexpected indentation in reviewed transformation block')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          exec(compile(script, 'v1.2.0-freeze-transform.py', 'exec'), {})

      - name: Remove temporary helpers before manifest generation
        run: git rm .github/workflows/apply-v1.2.0-freeze.yml .github/workflows/execute-v1.2.0-freeze.yml

      - name: Reject residual development-version tokens
        run: |
          set -euo pipefail
          if git grep -nE '1\.2\.0\.9000|1\.2\.0-dev' -- ':!paper/archive/**'; then
            echo "Residual development-version token found" >&2
            exit 1
          fi

      - name: Generate complete tracked-file manifest
        run: |
          python python/build_checksum_manifest.py --all-tracked --write
          python python/build_checksum_manifest.py --all-tracked --check

      - name: Run release-freeze editorial preflights
        run: |
          python python/validate_candidate_metadata.py
          python python/audit_manuscript.py

      - name: Commit exact pre-DOI release freeze
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: freeze version 1.2.0 pending Zenodo DOI"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0
