name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_manifest:
        description: 'Also enforce the frozen tracked-file checksum manifest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  account-free-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gdal-bin \
            libabsl-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run account-free scientific and contract checks
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.verify_manifest }}" == "true" ]]; then
            python python/run_all_checks.py --verify-manifest
          else
            python python/run_all_checks.py
          fi
      - name: Generate manuscript figures from archived GeoJSON files
        run: Rscript R/make_manuscript_figures.R
      - name: Upload SoftwareX evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: softwarex-candidate-evidence
          path: |
            paper/figures/generated/
            generated/verification_summary.json
            generated/generic_admin_example.geojson
            generated/release_contract_summary.json
          if-no-files-found: error
