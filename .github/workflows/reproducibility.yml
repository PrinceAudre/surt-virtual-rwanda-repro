name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  account-free-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libabsl-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run reproducibility checks
        run: python python/run_all_checks.py
      - name: Generate journal figures from archived GeoJSON files
        run: Rscript R/make_manuscript_figures.R
      - name: Upload manuscript evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-evidence
          path: |
            paper/figures/generated/
            generated/verification_summary.json
          if-no-files-found: error

  # BEGIN TEMPORARY DOI INSERTION JOB
  apply-v1-2-0-doi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-science-informatics-refinement-v1.3.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact helper parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e03cc2ea5bdc9dff4055932b2e1e141a6e8c19b8"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/reproducibility.yml"
      - name: Insert reserved Zenodo DOI
        run: python python/apply_v1_2_0_doi.py
      - name: Validate transformed release state
        run: |
          python python/validate_candidate_metadata.py
          python python/audit_manuscript.py
      - name: Remove helper and restore workflow files
        run: |
          set -euo pipefail
          rm python/apply_v1_2_0_doi.py
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
      - name: Generate and verify complete manifest
        run: |
          python python/build_checksum_manifest.py --all-tracked --write
          python python/build_checksum_manifest.py --all-tracked --check
          python python/validate_candidate_metadata.py
          python python/audit_manuscript.py
      - name: Commit and push DOI-bearing release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: insert Zenodo DOI for version 1.2.0"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0
