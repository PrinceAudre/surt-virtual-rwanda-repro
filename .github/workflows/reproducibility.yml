name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-free-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libabsl-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run reproducibility checks
        run: python python/run_all_checks.py
      - name: Generate journal figures from archived GeoJSON files
        run: Rscript R/make_manuscript_figures.R
      - name: Upload manuscript evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-evidence
          path: |
            paper/figures/generated/
            generated/verification_summary.json
          if-no-files-found: error
