name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-free-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run reproducibility checks
        run: python python/run_all_checks.py
