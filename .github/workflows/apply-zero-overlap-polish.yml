name: Apply exact zero-overlap figure polish

on:
  push:
    branches:
      - codex/earth-science-informatics-refinement-v1.3.0
    paths:
      - .github/workflows/apply-zero-overlap-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-science-informatics-refinement-v1.3.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded coordinate correction
        shell: python
        run: |
          from pathlib import Path
          path = Path("R/make_manuscript_figures.R")
          text = path.read_text(encoding="utf-8")
          old = '''  box(9.78, 5.00, 10.82, 5.54, "Return empty string", cex = 0.58)
  arrow(10.42, 6.25, 10.30, 5.54, "No", 10.57, 5.94)
'''
          new = '''  box(9.78, 5.06, 10.82, 5.60, "Return empty string", cex = 0.58)
  arrow(10.42, 6.25, 10.30, 5.60, "No", 10.57, 5.94)
'''
          if text.count(old) != 1:
              raise SystemExit("Expected Figure 3 coordinate anchor not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/make_manuscript_figures.R
          git commit -m "figures: eliminate residual Control 3 tangency"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0

      - name: Remove temporary workflow
        run: |
          git pull --ff-only origin codex/earth-science-informatics-refinement-v1.3.0
          git rm .github/workflows/apply-zero-overlap-polish.yml
          git commit -m "ci: remove temporary figure-polish workflow"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0
