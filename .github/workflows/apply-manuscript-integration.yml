name: Apply manuscript integration

on:
  push:
    branches:
      - codex/earth-science-informatics-refinement-v1.3.0
    paths:
      - .github/workflows/apply-manuscript-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: codex/earth-science-informatics-refinement-v1.3.0
          fetch-depth: 0

      - name: Apply exact-base manuscript integration
        run: python python/apply_manuscript_integration.py

      - name: Run manuscript and metadata preflights
        run: |
          python python/audit_manuscript.py
          python python/validate_candidate_metadata.py

      - name: Commit reviewed manuscript and remove temporary integration files
        run: |
          rm python/apply_manuscript_integration.py
          rm .github/workflows/apply-manuscript-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate reviewed provenance manuscript revisions"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0
