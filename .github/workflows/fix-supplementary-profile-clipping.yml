name: Fix Supplementary Figure S1 clipping

on:
  push:
    branches:
      - codex/earth-science-informatics-refinement-v1.3.0
    paths:
      - .github/workflows/fix-supplementary-profile-clipping.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: codex/earth-science-informatics-refinement-v1.3.0
          fetch-depth: 0

      - name: Apply exact-base S1 clipping fix
        run: python python/fix_supplementary_profile_clipping.py

      - name: Commit fix and remove temporary integration files
        run: |
          rm python/fix_supplementary_profile_clipping.py
          rm .github/workflows/fix-supplementary-profile-clipping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Supplementary Figure S1 clipping"
          git push origin HEAD:codex/earth-science-informatics-refinement-v1.3.0
