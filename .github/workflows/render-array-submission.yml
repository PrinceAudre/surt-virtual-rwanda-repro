name: Render Array submission package

on:
  push:
    branches:
      - review/array-submission-render
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install document rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils fonts-liberation
          python -m pip install --disable-pip-version-check python-docx

      - name: Convert submission sources to DOCX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/array_submission
          pandoc paper/submission/array-manuscript-final.md \
            --from=markdown+tex_math_dollars+tex_math_single_backslash \
            --standalone \
            --output=generated/array_submission/SuRT-GeoHarmonizer_Array_Manuscript_v1.4.0.docx
          pandoc paper/submission/cover_letter.md \
            --from=markdown \
            --standalone \
            --output=generated/array_submission/SuRT-GeoHarmonizer_Array_Cover_Letter.docx
          pandoc paper/submission/response_to_softwarex_reviewers.md \
            --from=markdown \
            --standalone \
            --output=generated/array_submission/SuRT-GeoHarmonizer_Response_to_SoftwareX_Reviewers.docx
          {
            printf '# Highlights\n\n'
            while IFS= read -r line; do
              [ -z "$line" ] || printf -- '- %s\n' "$line"
            done < paper/submission/highlights.txt
          } > generated/array_submission/highlights.md
          pandoc generated/array_submission/highlights.md \
            --from=markdown \
            --standalone \
            --output=generated/array_submission/SuRT-GeoHarmonizer_Highlights.docx

      - name: Normalize Word styles and page layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          root = Path("generated/array_submission")
          files = sorted(root.glob("*.docx"))

          def set_font(run, name, size=None, bold=None, italic=None):
              run.font.name = name
              rpr = run._element.get_or_add_rPr()
              rfonts = rpr.rFonts
              if rfonts is None:
                  rfonts = OxmlElement("w:rFonts")
                  rpr.insert(0, rfonts)
              for attr in ("ascii", "hAnsi", "eastAsia", "cs"):
                  rfonts.set(qn(f"w:{attr}"), name)
              if size is not None:
                  run.font.size = Pt(size)
              if bold is not None:
                  run.bold = bold
              if italic is not None:
                  run.italic = italic

          def add_page_number(paragraph):
              paragraph.alignment = WD_ALIGN_PARAGRAPH.CENTER
              run = paragraph.add_run()
              fld = OxmlElement("w:fldSimple")
              fld.set(qn("w:instr"), "PAGE")
              run._r.append(fld)

          for path in files:
              doc = Document(path)
              is_manuscript = "Manuscript" in path.name
              for section in doc.sections:
                  section.top_margin = Inches(0.8 if is_manuscript else 1.0)
                  section.bottom_margin = Inches(0.8 if is_manuscript else 1.0)
                  section.left_margin = Inches(0.8 if is_manuscript else 1.0)
                  section.right_margin = Inches(0.8 if is_manuscript else 1.0)
                  section.header_distance = Inches(0.3)
                  section.footer_distance = Inches(0.35)
                  if is_manuscript:
                      footer = section.footer
                      p = footer.paragraphs[0]
                      p.clear()
                      add_page_number(p)

              normal = doc.styles["Normal"]
              normal.font.name = "Times New Roman"
              normal.font.size = Pt(11 if is_manuscript else 12)
              normal.paragraph_format.space_after = Pt(6)
              normal.paragraph_format.line_spacing = 1.15
              for sname, size in [("Title", 15), ("Heading 1", 13), ("Heading 2", 12), ("Heading 3", 11)]:
                  if sname in doc.styles:
                      style = doc.styles[sname]
                      style.font.name = "Times New Roman"
                      style.font.size = Pt(size)
                      style.font.bold = True

              for para in doc.paragraphs:
                  for run in para.runs:
                      set_font(run, "Times New Roman", 11 if is_manuscript else 12)

              for table in doc.tables:
                  table.autofit = True
                  for row in table.rows:
                      for cell in row.cells:
                          for para in cell.paragraphs:
                              para.paragraph_format.space_after = Pt(2)
                              para.paragraph_format.line_spacing = 1.0
                              for run in para.runs:
                                  set_font(run, "Times New Roman", 8.5 if is_manuscript else 10)

              props = doc.core_properties
              props.title = "SuRT-GeoHarmonizer" if is_manuscript else path.stem.replace("_", " ")
              props.author = "TUYISHIME AUDRE PRINCE"
              props.last_modified_by = "TUYISHIME AUDRE PRINCE"
              doc.save(path)
          PY

      - name: Submission-content assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          root = Path("generated/array_submission")
          manuscript = Document(root / "SuRT-GeoHarmonizer_Array_Manuscript_v1.4.0.docx")
          text = "\n".join(p.text for p in manuscript.paragraphs)
          table_text = "\n".join(
              cell.text for table in manuscript.tables for row in table.rows for cell in row.cells
          )
          all_text = text + "\n" + table_text
          required = [
              "SuRT-GeoHarmonizer: A contract-first workflow for verifiable raster-to-administrative data harmonization",
              "10.5281/zenodo.23162055",
              "raster harmonization",
              "software verification",
          ]
          for item in required:
              if item not in all_text:
                  raise SystemExit(f"Missing required manuscript text: {item}")
          stale = [
              "Release and submission remain contingent on exact-tree validation",
              "A release candidate additionally requires complete tracked-file checksum verification",
          ]
          for item in stale:
              if item in all_text:
                  raise SystemExit(f"Stale pre-release manuscript text remains: {item}")

          source = Path("paper/submission/highlights.txt").read_text(encoding="utf-8").splitlines()
          highlights = [x.strip() for x in source if x.strip()]
          if len(highlights) != 5:
              raise SystemExit(f"Expected 5 highlights, found {len(highlights)}")
          too_long = [(x, len(x)) for x in highlights if len(x) > 85]
          if too_long:
              raise SystemExit(f"Highlight exceeds 85 characters: {too_long}")

          keyword_line = next(
              p.text for p in manuscript.paragraphs if p.text.startswith("Keywords:")
          )
          keywords = [x.strip() for x in keyword_line.split(":", 1)[1].split(";") if x.strip()]
          if len(keywords) != 6:
              raise SystemExit(f"Expected 6 submission keywords, found {len(keywords)}")

          for name in [
              "SuRT-GeoHarmonizer_Array_Cover_Letter.docx",
              "SuRT-GeoHarmonizer_Response_to_SoftwareX_Reviewers.docx",
              "SuRT-GeoHarmonizer_Highlights.docx",
          ]:
              if not (root / name).is_file():
                  raise SystemExit(f"Missing rendered DOCX: {name}")

          print("[PASS] submission DOCX assertions")
          print("[PASS] 5 highlights <=85 characters")
          print("[PASS] manuscript has exactly 6 submission keywords")
          PY

      - name: Convert DOCX files to PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/array_submission/pdf
          for f in generated/array_submission/*.docx; do
            libreoffice --headless --convert-to pdf --outdir generated/array_submission/pdf "$f"
          done
          for f in generated/array_submission/pdf/*.pdf; do
            pdfinfo "$f" | grep -E '^(Pages|Page size|File size):'
          done

      - name: Render PDF pages for visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/array_submission/renders
          for f in generated/array_submission/pdf/*.pdf; do
            stem="$(basename "$f" .pdf)"
            mkdir -p "generated/array_submission/renders/$stem"
            pdftoppm -png -r 120 "$f" "generated/array_submission/renders/$stem/page"
          done

      - name: Package submission files
        shell: bash
        run: |
          rm -f generated/array_submission/highlights.md
          sha256sum generated/array_submission/*.docx generated/array_submission/pdf/*.pdf \
            > generated/array_submission/SHA256SUMS.txt

      - name: Upload final submission-render artifact
        uses: actions/upload-artifact@v4
        with:
          name: array-submission-render
          path: |
            generated/array_submission/*.docx
            generated/array_submission/pdf/*.pdf
            generated/array_submission/renders/
            generated/array_submission/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
