name: Build Array submission package

on:
  push:
    branches:
      - submission/array-final-completion
    paths:
      - "paper/submission/**"
      - ".github/workflows/array-submission-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-submission-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fonts-liberation fonts-dejavu-core
          python -m pip install --disable-pip-version-check python-docx

      - name: Build editable Word files
        shell: bash
        run: |
          set -euo pipefail
          OUT="generated/array_submission_package"
          mkdir -p "$OUT"

          pandoc paper/submission/array-manuscript-final.md \
            --from=markdown+tex_math_dollars+pipe_tables+raw_tex \
            --to=docx --standalone \
            --output="$OUT/SuRT-GeoHarmonizer_Array_Manuscript_v1.4.0.docx"

          pandoc paper/submission/cover_letter.md \
            --from=markdown+pipe_tables \
            --to=docx --standalone \
            --output="$OUT/SuRT-GeoHarmonizer_Array_Cover_Letter.docx"

          pandoc paper/submission/response_to_softwarex_reviewers.md \
            --from=markdown+pipe_tables \
            --to=docx --standalone \
            --output="$OUT/SuRT-GeoHarmonizer_Response_to_SoftwareX_Reviewers.docx"

          awk 'NF {print "- " $0}' paper/submission/highlights.txt > "$OUT/highlights.md"
          pandoc "$OUT/highlights.md" \
            --from=markdown \
            --to=docx --standalone \
            --output="$OUT/SuRT-GeoHarmonizer_Highlights.docx"
          rm "$OUT/highlights.md"

      - name: Apply journal-safe Word formatting and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT
          from docx.shared import Cm, Pt
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          out = Path("generated/array_submission_package")

          def set_run_font(run, name="Times New Roman", size=12):
              run.font.name = name
              run.font.size = Pt(size)
              rPr = run._element.get_or_add_rPr()
              rFonts = rPr.rFonts
              if rFonts is None:
                  rFonts = OxmlElement("w:rFonts")
                  rPr.insert(0, rFonts)
              for attr in ("ascii", "hAnsi", "eastAsia", "cs"):
                  rFonts.set(qn(f"w:{attr}"), name)

          def set_cell_margins(cell, top=70, start=70, bottom=70, end=70):
              tcPr = cell._tc.get_or_add_tcPr()
              tcMar = tcPr.first_child_found_in("w:tcMar")
              if tcMar is None:
                  tcMar = OxmlElement("w:tcMar")
                  tcPr.append(tcMar)
              for m, v in (("top", top), ("start", start), ("bottom", bottom), ("end", end)):
                  node = tcMar.find(qn(f"w:{m}"))
                  if node is None:
                      node = OxmlElement(f"w:{m}")
                      tcMar.append(node)
                  node.set(qn("w:w"), str(v))
                  node.set(qn("w:type"), "dxa")

          def format_doc(path, kind):
              doc = Document(path)
              cp = doc.core_properties
              cp.author = "TUYISHIME AUDRE PRINCE"
              cp.last_modified_by = "TUYISHIME AUDRE PRINCE"
              cp.subject = "Array submission package"
              cp.keywords = "SuRT-GeoHarmonizer; Array; geospatial harmonization; reproducibility"
              if kind == "manuscript":
                  cp.title = "SuRT-GeoHarmonizer: A contract-first workflow for verifiable raster-to-administrative data harmonization"
              elif kind == "cover":
                  cp.title = "Cover letter - SuRT-GeoHarmonizer"
              elif kind == "response":
                  cp.title = "Response to prior SoftwareX reviewers - SuRT-GeoHarmonizer"
              else:
                  cp.title = "Highlights - SuRT-GeoHarmonizer"

              for section in doc.sections:
                  section.top_margin = Cm(2.5)
                  section.bottom_margin = Cm(2.5)
                  section.left_margin = Cm(2.5)
                  section.right_margin = Cm(2.5)
                  section.header_distance = Cm(1.25)
                  section.footer_distance = Cm(1.25)

              normal = doc.styles["Normal"]
              normal.font.name = "Times New Roman"
              normal.font.size = Pt(12)
              normal.paragraph_format.line_spacing = 1.15
              normal.paragraph_format.space_after = Pt(6)

              for sty_name, size in (("Title", 16), ("Heading 1", 14), ("Heading 2", 13), ("Heading 3", 12)):
                  if sty_name in doc.styles:
                      sty = doc.styles[sty_name]
                      sty.font.name = "Times New Roman"
                      sty.font.size = Pt(size)
                      sty.font.bold = True
                      sty.paragraph_format.keep_with_next = True
                      sty.paragraph_format.space_before = Pt(10)
                      sty.paragraph_format.space_after = Pt(5)

              if doc.paragraphs:
                  first = doc.paragraphs[0]
                  if "SuRT-GeoHarmonizer:" in first.text or first.text in {
                      "Cover letter", "Response to prior SoftwareX reviewers"
                  }:
                      first.style = doc.styles["Title"]
                      first.alignment = WD_ALIGN_PARAGRAPH.CENTER if kind == "manuscript" else WD_ALIGN_PARAGRAPH.LEFT

              if kind == "manuscript":
                  for p in doc.paragraphs[1:]:
                      if p.text.strip() == "Abstract":
                          break
                      p.alignment = WD_ALIGN_PARAGRAPH.CENTER

              if kind == "cover":
                  normal.paragraph_format.line_spacing = 1.0

              for p in doc.paragraphs:
                  for run in p.runs:
                      if run.style and run.style.name and "Source Code" in run.style.name:
                          run.font.size = Pt(10)
                      else:
                          set_run_font(run, size=12)

              for table in doc.tables:
                  table.alignment = WD_TABLE_ALIGNMENT.CENTER
                  table.autofit = True
                  table.style = "Table Grid"
                  for ridx, row in enumerate(table.rows):
                      if ridx == 0:
                          trPr = row._tr.get_or_add_trPr()
                          tblHeader = OxmlElement("w:tblHeader")
                          tblHeader.set(qn("w:val"), "true")
                          trPr.append(tblHeader)
                      for cell in row.cells:
                          cell.vertical_alignment = WD_CELL_VERTICAL_ALIGNMENT.CENTER
                          set_cell_margins(cell)
                          for p in cell.paragraphs:
                              p.paragraph_format.space_after = Pt(2)
                              p.paragraph_format.line_spacing = 1.0
                              for run in p.runs:
                                  set_run_font(run, size=9.5)
                                  if ridx == 0:
                                      run.font.bold = True

              doc.save(path)

          format_doc(out / "SuRT-GeoHarmonizer_Array_Manuscript_v1.4.0.docx", "manuscript")
          format_doc(out / "SuRT-GeoHarmonizer_Array_Cover_Letter.docx", "cover")
          format_doc(out / "SuRT-GeoHarmonizer_Response_to_SoftwareX_Reviewers.docx", "response")
          format_doc(out / "SuRT-GeoHarmonizer_Highlights.docx", "highlights")
          PY

      - name: Convert Word files to PDF for final visual inspection
        shell: bash
        run: |
          set -euo pipefail
          OUT="generated/array_submission_package"
          mkdir -p /tmp/lo-profile
          for f in "$OUT"/*.docx; do
            libreoffice --headless --nologo --nodefault --nofirststartwizard \
              -env:UserInstallation=file:///tmp/lo-profile \
              --convert-to pdf --outdir "$OUT" "$f"
          done
          printf '%s\n' "${GITHUB_SHA}" > "$OUT/SOURCE_COMMIT.txt"
          sha256sum "$OUT"/*.docx "$OUT"/*.pdf > "$OUT/SHA256SUMS.txt"

      - name: Upload Array submission package
        uses: actions/upload-artifact@v4
        with:
          name: array-submission-package
          path: generated/array_submission_package/
          if-no-files-found: error
          retention-days: 90
